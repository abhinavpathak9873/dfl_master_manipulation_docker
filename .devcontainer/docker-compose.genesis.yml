include:
  - path: docker-compose.yml

services:
  genesis:
    profiles: [genesis]
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.genesis
    image: dfl_master_manipulation:genesis-1.3.3
    container_name: dfl_master_genesis
    network_mode: host
    ipc: host
    shm_size: 16gb
    gpus:
      - driver: nvidia
        device_ids: ["${DFL_GENESIS_GPU_DEVICE:-0}"]
        capabilities: [gpu]
    working_dir: /root/ros2_ws
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-63}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      CYCLONEDDS_URI: file:///opt/dfl/scripts/cyclonedds.xml
      NVIDIA_VISIBLE_DEVICES: ${DFL_GENESIS_GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      PYOPENGL_PLATFORM: egl
      DFL_HEADLESS: ${DFL_HEADLESS:-true}
      DFL_SIMULATOR: genesis
      DFL_REAL_MOTION_ENABLED: "0"
    volumes:
      - ./src:/root/ros2_ws/src:rw
      - ../scripts:/opt/dfl/scripts:ro
      - ../tasks:/workspace/tasks:ro
      - ../calibration:/workspace/calibration:ro
      - ../objects:/workspace/objects:ro
      - ../models:/workspace/models:ro
      - ../data:/workspace/data:rw
      - ../logs:/workspace/logs:rw
      - dfl_genesis_build:/root/ros2_ws/build
      - dfl_genesis_install:/root/ros2_ws/install
      - dfl_genesis_log:/root/ros2_ws/log
      - dfl_genesis_cache:/root/.cache
      - dfl_core_install:/opt/dfl/core_install:ro
      - /etc/localtime:/etc/localtime:ro
    stdin_open: true
    tty: true
    init: true
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null && python -c 'from importlib.metadata import version; assert version(\"genesis-world\") == \"1.3.3\"'"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 30s
    command: ["sleep", "infinity"]

volumes:
  dfl_genesis_build:
  dfl_genesis_install:
  dfl_genesis_log:
  dfl_genesis_cache:
  dfl_core_install:
    external: true
    name: dfl_master_manipulation_dfl_core_install
